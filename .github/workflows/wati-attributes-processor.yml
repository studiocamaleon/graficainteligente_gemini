name: Wati Attributes Processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TRIGGER_SECRET_TOKEN: ${{ secrets.TRIGGER_SECRET_TOKEN }}

    steps:
      - name: Call processor edge function
        run: |
          if [ -z "${SUPABASE_PROJECT_ID}" ] || [ -z "${TRIGGER_SECRET_TOKEN}" ]; then
            echo "Skipping: missing SUPABASE_PROJECT_ID and/or TRIGGER_SECRET_TOKEN secrets."
            exit 0
          fi

          curl -sS -f --retry 2 --retry-delay 5 -X POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/process-wati-contact-attributes" \
            -H "Content-Type: application/json" \
            -H "X-Trigger-Secret: ${TRIGGER_SECRET_TOKEN}" \
            --data '{"limit":200}'
